[package]
name = "svudko-desktop"
version = "0.1.0"
license.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
slint = { workspace = true, default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "log",
] }
rfd.workspace = true
webbrowser.workspace = true
dirs.workspace = true
svudko-core.workspace = true
smol = { workspace = true }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
svudko-resolver-sd.workspace = true
svudko-resolver-exchange.workspace = true

[build-dependencies]
slint-build = "1.15"
