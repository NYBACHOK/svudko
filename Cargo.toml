[workspace]
resolver = "3"
members = ["svudko-common", "svudko-core", "svudko-desktop"]

[workspace.package]
license = "MIT"
edition = "2024"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
serde = "1.0"
thiserror = "2.0"
tokio = { version = "1.52" }
tracing = { version = "0.1", features = [] }
tracing-subscriber = { version = "0.3", features = [] }
# even through I use tokio, but slint uses it, so instead of mixing desktop uses 
# smol runtime outside of core
smol = "2.0"

svudko-common = { path = "./svudko-common" }
svudko-core = { path = "./svudko-core" }

[workspace.lints.rust]
rust_2018_idioms = "deny"
# missing_docs = "deny"
missing_debug_implementations = "allow"
future_incompatible = "deny"
unsafe-code = "deny"

[workspace.lints.clippy]
unused_async = "deny"
pedantic = "warn"
